name: Lesson 31
run-name: Tests run
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t my-playwright-app .
      - name: Run tests
        run: docker run my-playwright-app
